# Pulls every published SKILL.md listed in imageat.com's agent-skills index (generated
# from the live API catalog) and commits when anything changes.
name: Sync SKILL.md

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download skills
        run: |
          for name in $(curl -fsSL https://imageat.com/.well-known/agent-skills/index.json | jq -r '.skills[].name'); do
            mkdir -p "skills/$name"
            curl -fsSL "https://imageat.com/.well-known/agent-skills/$name/SKILL.md" -o "skills/$name/SKILL.md"
          done
      - name: Commit if changed
        run: |
          git add skills
          if git diff --cached --quiet; then
            echo "Skills are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skills from imageat.com"
          git push
