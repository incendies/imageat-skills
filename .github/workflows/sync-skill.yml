# Pulls the published SKILL.md from imageat.com, which is generated from the live
# API model catalog, and commits it when it changes.
name: Sync SKILL.md

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SKILL.md
        run: curl -fsSL https://imageat.com/.well-known/agent-skills/imageat/SKILL.md -o skills/imageat/SKILL.md
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "SKILL.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync SKILL.md from imageat.com"
          git push
